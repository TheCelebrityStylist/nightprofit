services:
  web:
    image: node:22
    working_dir: /app
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      # Vite >= 6.1 appends this to server.allowedHosts so the preview proxy's
      # Host header is accepted. The platform sets the value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vinext dev -H 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure

volumes:
  node_modules:
